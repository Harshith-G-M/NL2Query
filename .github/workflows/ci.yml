name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Tests on SQLite
        run: pytest -q
      - name: Tests on PostgreSQL
        run: pytest -q
        env: { TEST_DATABASE_URL: "postgresql://test:test@localhost:5432/test" }
      - name: Eval harness self-check (oracle must score 100%)
        run: python -m evals.run_eval --provider oracle --tag ci-selfcheck

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke-test the full stack
        run: |
          cp .env.example .env
          sed -i 's/^LLM_PROVIDER=.*/LLM_PROVIDER=mock/' .env
          sed -i "s/^SECRET_KEY=.*/SECRET_KEY=$(openssl rand -hex 32)/" .env
          docker compose up -d --build --wait --wait-timeout 180 db api frontend
          curl --fail --retry 10 --retry-delay 3 http://localhost:8000/health
          curl --fail --retry 10 --retry-delay 3 http://localhost:8501/_stcore/health
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
